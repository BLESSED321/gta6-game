<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Nights — a GTA-style open world</title>
<meta name="description" content="Leonida Nights: a top-down open-world crime game. Steal cars, run 4 missions, outrun the Leonida police, and make your fortune.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Leonida Nights: an open-world crime game. Walk with WASD, press E to enter a car, F to punch, R to restart, follow the mission marker to either safehouse."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
